; MicroQuick on M5Stack Core2 (ESP32, ILI9342C 320x240, FT6336U touch, AXP192).
;
; Open this folder (ports/m5stack-core2) in VS Code with the PlatformIO
; extension, then use "Upload" / "Monitor" from the PlatformIO toolbar.
; Before compiling, scripts/mq_generate.py compiles the QML to C++ (mqc) and
; converts fonts/images (mqassets, built from this repository with Qt 6).

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified@^0.2.7
    microquick=symlink://../../runtime

build_flags =
    -O2
    -DMQ_STRING_CAPACITY=64
    ; the application state (~80 KB) is placed in the internal heap at startup:
    ; the ESP32 static RAM segment (.bss) is smaller than the heap
    -DMQ_APP_PLATFORM_STORAGE

extra_scripts = pre:scripts/mq_generate.py

; ---- MicroQuick application (paths relative to this folder)
custom_mq_main = ../../examples/core2/Main.qml
custom_mq_qml =
    ../../examples/demo/Button.qml
    ../../examples/demo/Switch.qml
    ../../examples/demo/ProgressBar.qml
custom_mq_assets =
    ../../examples/demo/images/logo.png
custom_mq_font = ../../fonts/DejaVuSans.ttf
